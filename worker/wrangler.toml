# ==========================================================================
# Cloudflare Worker configuration.
# Beginner note: this file tells Cloudflare "what to run" (main) and "which
# free database to attach" (the [[d1_databases]] block). It contains no
# secrets — passwords/session keys are set separately as Wrangler "secrets"
# (see worker/README.md), never written into this file.
# ==========================================================================

name = "doctor-appointment-booking-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# You will replace database_id with your own after running:
#   npx wrangler d1 create doctor_appointments
# (that command prints a database_id for YOUR Cloudflare account)
[[d1_databases]]
binding = "DB"
database_name = "doctor_appointments"
database_id = "d5bb6d56-f46b-444f-8573-b5ee01504b0f"

# The exact production website origin allowed to call this API.
[vars]
ALLOWED_ORIGIN = "https://hwc-co.in"
EMAIL_FROM = "Dr. Revathy's Clinic <appointments@updates.hwc-co.in>"
